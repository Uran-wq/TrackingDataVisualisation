<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VR tracking — interactive 3D viewer</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #fafafa;
               font-family: "Segoe UI", system-ui, sans-serif; }
  #scene { display: block; width: 100%; height: 100%; }
  .panel { position: absolute; background: rgba(255,255,255,0.92);
           border: 1px solid #d0d0d0; border-radius: 6px; padding: 10px 14px;
           box-shadow: 0 1px 4px rgba(0,0,0,0.12); font-size: 13px; color: #222; }
  #hud-top { top: 12px; left: 12px; max-width: 340px; }
  #hud-top .title { font-weight: 600; font-size: 15px; margin-bottom: 6px; }
  #hud-top .legend span { margin-right: 12px; white-space: nowrap; }
  .dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%;
         margin-right: 5px; vertical-align: -1px; }
  .dot.head  { background: #1f77b4; }
  .dot.left  { background: #d62728; }
  .dot.right { background: #2ca02c; }
  #hud-top .help, #hud-top .units { color: #666; font-size: 12px; margin-top: 6px; }
  #hud-bottom { left: 50%; transform: translateX(-50%); bottom: 14px;
                display: flex; align-items: center; gap: 10px; padding: 8px 14px; }
  #hud-bottom button, #hud-bottom select {
      font: inherit; font-size: 13px; padding: 3px 10px; border: 1px solid #bbb;
      border-radius: 4px; background: #fff; cursor: pointer; color: #222; }
  #hud-bottom button:hover, #hud-bottom select:hover { background: #f0f0f0; }
  #play { width: 42px; font-size: 15px; }
  #reset { white-space: nowrap; }
  #scrub { width: min(46vw, 480px); accent-color: #1f77b4; }
  #time { font-variant-numeric: tabular-nums; color: #333; min-width: 120px;
          text-align: center; }
  #error { display: none; position: absolute; top: 40%; left: 50%;
           transform: translate(-50%, -50%); background: #fff2f2; color: #a33;
           border: 1px solid #e0b0b0; border-radius: 6px; padding: 18px 24px;
           font-size: 14px; max-width: 520px; }
</style>
</head>
<body>
<canvas id="scene"></canvas>

<div id="hud-top" class="panel">
  <div class="title">VR tracking — head &amp; hands in 3D</div>
  <div class="legend">
    <span><i class="dot head"></i>Head</span>
    <span><i class="dot left"></i>Left hand</span>
    <span><i class="dot right"></i>Right hand</span>
  </div>
  <div class="help">drag: orbit &middot; right-drag: pan &middot; wheel: zoom</div>
  <div class="units" id="units-note"></div>
</div>

<div id="hud-bottom" class="panel">
  <button id="play" title="play / pause">&#10074;&#10074;</button>
  <select id="speed" title="playback speed">
    <option value="0.25">0.25&times;</option>
    <option value="0.5">0.5&times;</option>
    <option value="1" selected>1&times;</option>
    <option value="2">2&times;</option>
    <option value="4">4&times;</option>
  </select>
  <input type="range" id="scrub" min="0" max="1000" step="1" value="0">
  <span id="time">0.0 / 0.0 s</span>
  <button id="reset" title="restore the initial camera view">Reset camera</button>
</div>

<div id="error"></div>

<script src="lib/three.min.js"></script>
<script src="lib/OrbitControls.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
